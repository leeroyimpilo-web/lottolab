name: LottoLab Next Native Android
on:
  push:
    branches: [main]
    paths: ['lottolab-next/**', '.github/workflows/lottolab-next.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lottolab-next-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore best-effort debug signing key cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: lottolab-next-debug-identity-v1
      - name: Install platform
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test backend
        run: python -m unittest discover -s lottolab-next/backend -v
      - name: Test and build fresh native project
        working-directory: lottolab-next
        run: gradle --no-daemon :core:test :app:testDebugUnitTest :app:assembleDebug :app:lintDebug
      - name: Report preview signing identity
        if: always()
        run: |
          echo '### Preview APK signing' >> "$GITHUB_STEP_SUMMARY"
          echo 'Debug signing is not a stable production identity. Existing previews with a different certificate cannot be upgraded in place.' >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$HOME/.android/debug.keystore" ]; then
            keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey 2>/dev/null | grep 'SHA256:' >> "$GITHUB_STEP_SUMMARY" || true
          else
            echo 'No default debug keystore was found at expected path.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LottoLab-Next-Reports
          path: |
            lottolab-next/core/build/reports/
            lottolab-next/app/build/reports/
      - uses: actions/upload-artifact@v4
        with:
          name: LottoLab-Next-Android-APK
          path: lottolab-next/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
  device-check:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Reclaim runner disk for emulator
        run: |
          sudo rm -rf /usr/share/dotnet /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/ndk
          df -h /home/runner
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Native navigation test and screenshot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disk-size: 2048M
          ram-size: 2048M
          disable-animations: true
          script: |
            cd lottolab-next && gradle --no-daemon :app:connectedDebugAndroidTest
            adb shell am force-stop za.co.lottolab.next
            adb shell am start -n za.co.lottolab.next/.MainActivity
            sleep 5
            adb shell screencap -p /sdcard/lottolab-home.png
            adb pull /sdcard/lottolab-home.png lottolab-home.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LottoLab-Next-Device-Check
          path: |
            lottolab-home.png
            lottolab-next/app/build/reports/androidTests/
