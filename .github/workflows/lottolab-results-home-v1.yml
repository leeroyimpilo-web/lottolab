name: LottoLab Results Home APK
on:
  push:
    branches: [lottolab-results-home-v1]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Extract freshly authored source
        run: |
          mkdir -p LottoLabResultsAndroid
          base64 -d LottoLabResultsAndroid-source.tar.xz.b64 | tar -xJ -C LottoLabResultsAndroid
      - name: Assemble APK
        working-directory: LottoLabResultsAndroid
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LottoLabResults-debug-apk
          path: LottoLabResultsAndroid/app/build/outputs/apk/debug/app-debug.apk
