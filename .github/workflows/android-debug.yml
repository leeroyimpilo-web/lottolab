name: Build LottoLab Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'hooks/**'
      - 'lib/**'
      - 'public/**'
      - 'next.config.mjs'
      - 'capacitor.config.json'
      - 'package.json'
      - '.github/workflows/android-debug.yml'

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out LottoLab
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
          run_install: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install web dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Add Capacitor Android dependencies
        run: |
          pnpm add @capacitor/core@7 @capacitor/android@7
          pnpm add -D @capacitor/cli@7

      - name: Try to bundle historical draws (network optional)
        run: |
          if ! node scripts/build-draw-seed.mjs; then
            echo '::warning::Lottery feed timed out or was unavailable. Building with existing empty/verified seed; users can sync when online.'
          fi

      - name: Type-check source
        run: pnpm exec tsc --noEmit

      - name: Build static web app
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: pnpm run build

      - name: Generate Android wrapper
        run: |
          pnpm exec cap add android
          pnpm exec cap sync android

      - name: Install Android platform using runner SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android command-line tools are missing from runner"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Compile installable debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload LottoLab APK
        uses: actions/upload-artifact@v4
        with:
          name: LottoLab-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
