name: Build LottoLab Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'hooks/**'
      - 'lib/**'
      - 'public/**'
      - 'next.config.mjs'
      - 'capacitor.config.json'
      - 'package.json'
      - '.github/workflows/android-debug.yml'

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out LottoLab
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
          run_install: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install web dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Add Capacitor Android dependencies
        run: |
          pnpm add @capacitor/core@7 @capacitor/android@7
          pnpm add -D @capacitor/cli@7

      - name: Bundle real historical draw archive
        run: node scripts/build-draw-seed.mjs

      - name: Type-check source
        run: pnpm exec tsc --noEmit

      - name: Build static web app
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: pnpm run build

      - name: Generate Android wrapper
        run: |
          pnpm exec cap add android
          pnpm exec cap sync android

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Compile installable debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload LottoLab APK
        uses: actions/upload-artifact@v4
        with:
          name: LottoLab-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
