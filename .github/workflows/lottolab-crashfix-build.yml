name: Build LottoLab Laboratory Crashfixed APK
on:
  push:
    branches: [lottolab-laboratory-crashfix]
    paths: ['.github/workflows/lottolab-crashfix-build.yml', 'LottoLabNativeBuildBundle.b64.txt']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Extract original native Android app
        run: base64 -d LottoLabNativeBuildBundle.b64.txt | tar -xJf -
      - name: Correct invalid packed colors causing runtime exception
        run: |
          SRC=native-android/app/src/main/java/za/co/lottolab/MainActivity.kt
          grep -q 'Color(game.accent.toULong())' "$SRC"
          sed -i 's/Color(game.accent.toULong())/Color(game.accent.toInt())/g' "$SRC"
          grep -q 'Color(game.accent.toInt())' "$SRC"
      - name: Build signed debug APK
        working-directory: native-android
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: LottoLab-Laboratory-v1-1-Crashfix-APK
          path: native-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
